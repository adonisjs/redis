name: test
on:
  - workflow_call

permissions:
  contents: read

jobs:
  test_linux:
    runs-on: ubuntu-latest
    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 7007
      REDIS_CLUSTER_PORTS: '7000,7001,7002'
    strategy:
      matrix:
        node-version: ['latest']
        redis-version: ['6.0.20', '7.0.0']

    services:
      redis:
        image: grokzen/redis-cluster:${{ matrix.redis-version }}
        env:
          REDIS_CLUSTER_IP: 0.0.0.0
          IP: 0.0.0.0
          STANDALONE: 'true'
        ports:
          - '7007:7007'
          - '7000-7005:7000-7005'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run test
