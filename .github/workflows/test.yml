name: test
on:
  - push
  - pull_request
  - workflow_call

jobs:
  test_linux:
    runs-on: ubuntu-latest
    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 7007
      REDIS_CLUSTER_PORTS: '7000,7001,7002'
    strategy:
      matrix:
        node-version: ["lts/iron", "lts/jod", "latest"]
        redis-version: ["6.0.20", "6.2.14", "7.0.15", "7.4-rc1", "latest"]

    services:
      redis:
        image: grokzen/redis-cluster:${{ matrix.redis-version }}
        env:
          REDIS_CLUSTER_IP: 0.0.0.0
          IP: 0.0.0.0
          STANDALONE: 'true'
        ports:
          - "7007:7007"
          - "7000-7005:7000-7005"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm run test
